services:
  relay:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: ./runtime/ftp.json
        target: /run/config/ftp.json
        read_only: true
        bind:
          create_host_path: false
      - ftp_state:/app/state/ftp
      - live_data:/app/dist/live
    secrets:
      - ftp_password
    expose:
      - '8080'

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      RHUM_DOMAIN: ${RHUM_DOMAIN:?Définissez RHUM_DOMAIN avec le domaine public du flux}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - relay

secrets:
  ftp_password:
    file: ./runtime/ftp_password

volumes:
  ftp_state:
  live_data:
  caddy_data:
  caddy_config:
